# Local development only. The API continues to use SQLite at this stage.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: task_manager
      POSTGRES_DB: task_manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-task_manager_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_manager -d task_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
